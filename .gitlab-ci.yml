variables:
    DEPLOY_MKDOCS: "true"
    DEPLOY_HIC: "false"

include:
    - ".gitlab-ci.mkdocs.yml"
    #- ".gitlab-ci.hic.yml"

# This is in order to estabilish a webhook connection to a discord server
  stages:
  - notification
success_notification:
  stage: notification
  script:
    - wget https://raw.githubusercontent.com/DiscordHooks/gitlab-ci-discord-webhook/master/send.sh
    - chmod +x send.sh
    - ./send.sh success $WEBHOOK_URL
  when: on_success
failure_notification:
  stage: notification
  script:
    - wget https://raw.githubusercontent.com/DiscordHooks/gitlab-ci-discord-webhook/master/send.sh
    - chmod +x send.sh
    - ./send.sh failure $WEBHOOK_URL
  when: on_failure